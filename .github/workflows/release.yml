name: Release

on:
  push:
    tags:
      - "v*"

# Unlike Validate, this one has to write: creating a release is the whole job.
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # release notes are generated from history

      # A tag that disagrees with the manifest is worse than no tag: HACS
      # offers the tag name while Home Assistant reports the manifest one, and
      # the card's cache-busting `?v=` follows the manifest. Stop here instead.
      - name: Check the tag matches the manifest version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest="$(jq -r .version custom_components/pareto/manifest.json)"
          if [ "$tag" != "$manifest" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match manifest version ${manifest}"
            exit 1
          fi

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --generate-notes
